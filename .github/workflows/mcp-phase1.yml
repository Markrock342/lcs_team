name: MCP Phase 1 validation
on:
  pull_request:
    paths:
      - 'src/lib/mcp/**'
      - 'src/app/api/mcp/**'
      - 'scripts/tests/mcp.test.mjs'
      - '.github/workflows/mcp-phase1.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/tests/mcp.test.mjs
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
